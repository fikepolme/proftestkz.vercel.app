<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldID — Познай себя</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --purple: #818cf8; --bg: #030712;
            --analyst: #88619a; --diplomat: #33a474; --sentinel: #4298b4; --explorer: #e4ae3a;
        }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(3,7,18,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; font-size: 1.5rem; cursor: pointer; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary); }
        .nav-links span { margin-left: 20px; cursor: pointer; font-weight: 600; opacity: 0.7; transition: 0.3s; }
        .nav-links span:hover { opacity: 1; color: var(--primary); }

        section { display: none; flex: 1; padding: 60px 5%; animation: fadeIn 0.4s ease-in-out; }
        section.active { display: flex; flex-direction: column; align-items: center; }

        .glass { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 32px; width: 100%; max-width: 800px; box-sizing: border-box; text-align: center; }
        
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin-bottom: 20px; line-height: 1.1; }
        .btn { background: #fff; color: #000; padding: 18px 45px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255,255,255,0.2); }

        .q-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 40px; min-height: 100px; }
        .scale { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; margin: 0 auto; }
        .dot { cursor: pointer; border-radius: 50%; border: 2px solid #334155; transition: 0.3s; }
        .dot:hover { border-color: var(--primary); transform: scale(1.2); }

        .type-card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin: 10px; width: 200px; text-align: center; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="go('home')">WORLD<span>ID</span></div>
    <div class="nav-links">
        <span onclick="go('home')">Главная</span>
        <span onclick="go('types')">Типы</span>
    </div>
</nav>

<section id="home" class="active">
    <h1>Твоя личность — твоя сила.</h1>
    <p style="color: #94a3b8; margin-bottom: 40px; font-size: 1.2rem;">Пройди тест и узнай свой психотип среди 16 вариантов.</p>
    <button class="btn" onclick="go('test')">НАЧАТЬ ТЕСТ</button>
</section>

<section id="test">
    <div class="glass">
        <div id="q-text" class="q-text">Загрузка...</div>
        <div class="scale">
            <span style="color: #10b981; font-weight: 800;">ДА</span>
            <div class="dot" style="width: 60px; height: 60px;" onclick="nx(3)"></div>
            <div class="dot" style="width: 40px; height: 40px;" onclick="nx(1)"></div>
            <div class="dot" style="width: 25px; height: 25px;" onclick="nx(0)"></div>
            <div class="dot" style="width: 40px; height: 40px;" onclick="nx(-1)"></div>
            <div class="dot" style="width: 60px; height: 60px;" onclick="nx(-3)"></div>
            <span style="color: #f43f5e; font-weight: 800;">НЕТ</span>
        </div>
    </div>
</section>

<section id="types">
    <h2>Все 16 типов личности</h2>
    <div class="grid">
        <div class="type-card" style="border-top: 4px solid var(--analyst)">Стратег (INTJ)</div>
        <div class="type-card" style="border-top: 4px solid var(--analyst)">Ученый (INTP)</div>
        <div class="type-card" style="border-top: 4px solid var(--diplomat)">Активист (INFJ)</div>
        <div class="type-card" style="border-top: 4px solid var(--diplomat)">Посредник (INFP)</div>
        <div class="type-card" style="border-top: 4px solid var(--sentinel)">Администратор (ISTJ)</div>
        <div class="type-card" style="border-top: 4px solid var(--explorer)">Артист (ISFP)</div>
        </div>
</section>
