<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00f2fe; --bg: #030712; --card: rgba(255,255,255,0.03); }
        body { margin: 0; font-family: 'Manrope', sans-serif; background: var(--bg); color: white; text-align: center; }
        
        section { display: none; padding: 60px 20px; animation: fadeIn 0.3s ease; }
        section.active { display: block; }

        .container { max-width: 800px; margin: 0 auto; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 30px; backdrop-filter: blur(10px); }
        
        .btn { background: white; color: black; padding: 18px 40px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1rem; margin: 10px; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        .scale { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 40px; }
        .dot { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #334155; cursor: pointer; transition: 0.3s; }
        .dot:hover { border-color: var(--p); background: rgba(0,242,254,0.1); }
        .dot.big { width: 60px; height: 60px; }
        .dot.small { width: 35px; height: 35px; }

        .progress-bar { width: 100%; height: 4px; background: #1e293b; border-radius: 10px; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: var(--p); width: 0%; transition: 0.4s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<nav style="padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <strong style="cursor:pointer; font-size: 1.2rem; letter-spacing: 2px;" onclick="goTo('home')">PSYCHO_METRIC</strong>
</nav>

<section id="home" class="active">
    <div class="container">
        <h1 style="font-size: 3.5rem; margin-bottom: 10px;">Кто ты на самом деле?</h1>
        <p style="opacity: 0.6; font-size: 1.2rem; margin-bottom: 40px;">Универсальный тест для поиска своего призвания.</p>
        <div class="glass">
            <h3>Готовы начать?</h3>
            <p>Тест займет около 2 минут. Отвечайте быстро и честно.</p>
            <button class="btn" onclick="goTo('quiz')">НАЧАТЬ ТЕСТ</button>
        </div>
    </div>
</section>

<section id="quiz">
    <div class="container">
        <div class="progress-bar"><div id="bar" class="progress-fill"></div></div>
        <div class="glass">
            <h2 id="question" style="min-height: 80px; font-size: 1.8rem;">Загрузка вопроса...</h2>
            <div class="scale">

                <div class="dot big" onclick="handle(3)"></div>
                <div class="dot" onclick="handle(1)"></div>
                <div class="dot small" onclick="handle(0)"></div>
                <div class="dot" onclick="handle(-1)"></div>
