<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир Личностей | Узнай себя</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --analyst: #88619a; --diplomat: #33a474; --sentinel: #4298b4; --explorer: #e4ae3a;
            --bg: #0f1115; --card: #1a1d23; --text: #e2e8f0;
        }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        
        header { padding: 20px 5%; display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); border-bottom: 1px solid #333; }
        .logo { font-weight: 900; font-size: 1.4rem; color: #fff; text-transform: uppercase; letter-spacing: 2px; }

        section { display: none; padding: 60px 5%; animation: fadeIn 0.4s ease; }
        .active { display: block; }

        /* Home Page */
        .hero { text-align: center; max-width: 900px; margin: 0 auto; padding: 60px 0; }
        .hero h1 { font-size: 3.5rem; margin-bottom: 20px; color: #fff; }
        .hero p { font-size: 1.2rem; opacity: 0.8; margin-bottom: 40px; }

        .btn-start { background: #fff; color: #000; padding: 20px 50px; border-radius: 50px; font-weight: 900; border: none; cursor: pointer; text-decoration: none; font-size: 1rem; transition: 0.3s; }
        .btn-start:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(255,255,255,0.2); }

        /* Quiz Box */
        .quiz-card { max-width: 700px; margin: 0 auto; background: var(--card); padding: 50px; border-radius: 40px; border: 1px solid #333; text-align: center; }
        .progress-bar { width: 100%; height: 6px; background: #2d3139; border-radius: 10px; margin-bottom: 40px; overflow: hidden; }
        .progress-fill { height: 100%; background: #fff; width: 0%; transition: 0.4s; }
        
        .question-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 40px; color: #fff; }

        .scale { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 0 auto; }
        .dot { cursor: pointer; border-radius: 50%; border: 2px solid #444; transition: 0.3s; }
        .dot:hover { border-color: #fff; transform: scale(1.1); }
        .agree { border-color: var(--diplomat); }
        .disagree { border-color: #f43f5e; }

        /* Results */
        .result-title { font-size: 3rem; margin-bottom: 10px; }
        .group-tag { display: inline-block; padding: 5px 15px; border-radius: 5px; font-weight: 900; margin-bottom: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="logo">Self_Discovery</div>
    <div style="cursor:pointer" onclick="show('home')">Главная</div>
</header>

<section id="home" class="active">
    <div class="hero">
        <h1>Твоя личность — твоя суперсила</h1>
        <p>Пройди самый точный тест и узнай, кто ты: стратег, вдохновитель или надежный хранитель традиций.</p>
        <button class="btn-start" onclick="show('test')">НАЧАТЬ ТЕСТ</button
