<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Type Explorer | Твой Психотип</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --bg: #030712; --card: rgba(255, 255, 255, 0.03);
            --analyst: #88619a; --diplomat: #33a474; --sentinel: #4298b4; --explorer: #e4ae3a;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); color: white; line-height: 1.5;
            overflow-x: hidden;
        }
        
        /* Navigation */
        nav { 
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; 
            background: rgba(3,7,18,0.9); backdrop-filter: blur(10px); 
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-weight: 800; font-size: 1.5rem; cursor: pointer; letter-spacing: -1px; }
        .logo span { color: var(--primary); }
        .nav-links span { margin-left: 20px; cursor: pointer; font-size: 0.9rem; font-weight: 600; opacity: 0.7; transition: 0.3s; }
        .nav-links span:hover { opacity: 1; color: var(--primary); }

        /* Sections Control */
        section { display: none; padding: 80px 5%; min-height: 90vh; animation: fadeIn 0.5s ease; }
        section.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Hero & Cards */
        .container { max-width: 1000px; width: 100%; text-align: center; }
        h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; margin-bottom: 20px; line-height: 1.1; }
        .glass-card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); padding: 40px; border-radius: 32px; backdrop-filter: blur(20px); width: 100%; }
        
        .btn { 
            background: var(--primary); color: #000; padding: 20px 50px; border-radius: 50px; 
            font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1.1rem; margin-top: 30px;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 242, 254, 0.4); }

        /* Quiz UI */
        .q-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 40px; min-height: 100px; }
        .scale { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; margin: 0 auto; }
        .dot { 
            cursor: pointer; border-radius: 50%; border: 2px solid #334155; transition: 0.3s; 
            background: transparent;
        }
        .dot:hover { transform: scale(1.2); border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }

        /* Groups Grid */
        .groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 50px; width: 100%; }
        .g-item { padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
        .g-item h4 { margin: 0 0 10px 0; font-size: 1.2rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
