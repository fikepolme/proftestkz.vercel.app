<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldID | Психология и Личность</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --purple: #818cf8; --bg: #05070a;
            --analyst: #88619a; --diplomat: #33a474; --sentinel: #4298b4; --explorer: #e4ae3a;
        }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; line-height: 1.6; }
        
        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1e26; sticky; top: 0; background: rgba(5,7,10,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-weight: 800; font-size: 1.4rem; cursor: pointer; color: var(--primary); }

        section { display: none; padding: 60px 5%; min-height: 80vh; animation: fadeIn 0.4s ease; }
        section.active { display: block; }

        .container { max-width: 1000px; margin: 0 auto; text-align: center; }
        .btn { background: white; color: black; padding: 18px 40px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1rem; margin-top: 20px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }

        /* Quiz Box */
        .q-box { background: rgba(255,255,255,0.03); border: 1px solid #1a1e26; padding: 50px; border-radius: 40px; margin-top: 40px; }
        .scale { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 40px auto; }
        .dot { cursor: pointer; border-radius: 50%; border: 2px solid #334155; transition: 0.3s; }
        .dot:hover { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); transform: scale(1.1); }

        .progress-w { width: 100%; height: 4px; background: #1a1e26; border-radius: 10px; margin-bottom: 30px; }
        .progress-f { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="go('home')">WORLD_ID</div>
    <div style="cursor:pointer; opacity: 0.7;" onclick="go('home')">Главная</div>
</nav>

<section id="home" class="active">
    <div class="container">
        <h1 style="font-size: 3.5rem; margin-bottom: 20px;">Кто ты в этом мире?</h1>
        <p style="color: #94a3b8; font-size: 1.2rem; max-width: 700px; margin: 0 auto 40px;">Пройди тест на базе 16 типов личности и узнай свои сильные стороны в карьере, бизнесе и жизни.</p>
        <button class="btn" onclick="go('test')">ПРОЙТИ ТЕСТ</button>
    </div>
</section>

<section id="test">
    <div class="container">
        <div class="progress-w"><div id="bar" class="progress-f"></div></div>
        <div class="q-box">
            <h2 id="q-text" style="min-height: 100px;">...</h2>
            <div class="scale">
                <span style="color: #10b981; font-weight: 800;">ДА</span>
                <div class="dot" style="width: 60px; height: 60px;" onclick="nx(3)"></div>
                <div class="dot" style="width: 40px; height: 40px;" onclick="nx(1)"></div>
                <div class="dot" style="width: 25px; height: 25px;" onclick="nx(0)"></div>
                <div class="dot" style="width: 40px; height: 40px;" onclick="nx(-1)"></div>
                <div class="dot" style="width: 60px; height: 60px;" onclick="nx(-3)"></div>
                <span style="color: #f43f5e; font-weight: 800;">НЕТ</span>
            </div>
        </div>
    </div>
</section>

<section id="result">
    <div class="container">
        <div class="q-box">
            <h4 id="res-group" style="text-transform: uppercase; letter-spacing: 2px;"></h4>
            <h1 id="res-title" style="color: var(--primary); margin: 10px 0;"></h1>
            <p id="res-desc" style="font-size: 1.2rem; color: #94a3b8;"></p>
            <div id="compat" style="margin-top: 20px; font-weight: 700; color: var(--purple);"></div>
            <button class="btn" onclick="location.href='https://t.me/NuIIReference'">ОБСУДИТЬ В TG</button>
        </div>
    </div>
</section>

<script>
    const qs = [
        "Вам легко заводить разговор с новыми людьми.",
        "Вы предпочитаете планировать дела заранее.",
        "Вы принимаете решения головой, а не сердцем.",
        "Вам нравится быть в центре внимания.",
        "Вы часто задумываетесь о смысле вещей.",
        "Вы считаете, что дисциплина важнее таланта.",
        "Вам легко понять чужие эмоции.",
        "Вы часто импровизируете в сложных ситуациях.",
        "Вы всегда доводите начатое до конца.",
        "Вы любите порядок во всем, что вас окружает."
    ];

    let c = 0, s = 0;

    function go(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'test') { c = 0; s = 0; update(); }
        window.scrollTo(0,0);
    }

    function update() {
        document.getElementById('q-text').innerText = qs[c];
        document.getElementById('bar').style.width = (c / qs.length) * 100 + '%';
    }

    function nx(v) {
        s += v; c++;
        if(c < qs.length) update();
        else finish();
    }

    function finish() {
        go('result');
        const g = document.getElementById('res-group');
        const t = document.getElementById('res-title');
        const d = document.getElementById('res-desc');
        const comp = document.getElementById('compat');

        if(s > 10) {
            g.innerText = "Дипломаты"; g.style.color = "var(--diplomat)";
            t.innerText = "Борец (ENFP)";
            d.innerText = "Вы — творческая и свободная личность, которая видит возможности в любой ситуации.";
            comp.innerText = "Лучшая совместимость: Стратег (INTJ)";
        } else if (s > 0) {
            g.innerText = "Аналитики"; g.style.color = "var(--analyst)";
            t.innerText = "Полемист (ENTP)";
            d.innerText = "Ваш ум — это генератор идей. Вы любите бросать вызов стереотипам.";
            comp.innerText = "Лучшая совместимость: Адвокат (INFJ)";
        } else {
            g.innerText = "Хранители"; g.style.color = "var(--sentinel)";
            t.innerText = "Администратор (ISTJ)";
            d.innerText = "Вы — человек слова и дела. Ваша надежность — ваш главный капитал.";
            comp.innerText = "Лучшая совместимость: Артист (ISFP)";
        }
    }
</script>
</body>
</html>
