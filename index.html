<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldID | Энциклопедия Личностей</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --purple: #818cf8; --bg: #030712;
            --analyst: #88619a; --diplomat: #33a474; --sentinel: #4298b4; --explorer: #e4ae3a;
        }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; line-height: 1.6; }
        
        nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(3,7,18,0.9); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 800; font-size: 1.5rem; cursor: pointer; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary); }
        .nav-links span { margin-left: 20px; cursor: pointer; font-weight: 600; opacity: 0.7; transition: 0.3s; font-size: 0.9rem; }
        .nav-links span:hover { opacity: 1; color: var(--primary); }

        section { display: none; padding: 60px 5%; animation: fadeIn 0.4s ease; }
        section.active { display: block; }

        .container { max-width: 1100px; margin: 0 auto; text-align: center; }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; letter-spacing: -2px; margin-bottom: 20px; }
        
        /* Grid for Types */
        .types-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
        .type-card { background: rgba(255,255,255,0.03); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; text-align: left; }
        .type-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.06); border-color: var(--primary); }
        .type-card h3 { margin: 10px 0; font-size: 1.4rem; }
        .type-card p { font-size: 0.9rem; color: #94a3b8; }

        /* Quiz Styling */
        .quiz-box { max-width: 700px; margin: 40px auto; background: rgba(255,255,255,0.02); padding: 50px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); }
        .scale { display: flex; justify-content: space-between; align-items: center; margin-top: 50px; }
        .dot { cursor: pointer; border-radius: 50%; border: 2px solid #334155; transition: 0.3s; }
        .dot:hover { border-color: var(--primary); transform: scale(1.2); }

        .btn { background: #fff; color: #000; padding: 18px 45px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .btn:hover { box-shadow: 0 10px 30px rgba(255,255,255,0.2); transform: scale(1.05); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="go('home')">WORLD<span>ID</span></div>
    <div class="nav-links">
