<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Personality ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --purple: #818cf8; --bg: #030712;
            --analyst: #88619a; --diplomat: #33a474; --sentinel: #4298b4; --explorer: #e4ae3a;
        }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(3,7,18,0.8); backdrop-filter: blur(15px); sticky; top:0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; cursor: pointer; }
        .logo span { color: var(--primary); }

        section { display: none; flex: 1; padding: 40px 5%; animation: fadeIn 0.4s ease; }
        section.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .glass { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); padding: 50px 30px; border-radius: 40px; max-width: 800px; width: 100%; box-sizing: border-box; text-align: center; }
        
        .btn { background: white; color: black; padding: 18px 45px; border-radius: 50px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 1.1rem; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255,255,255,0.2); }

        .q-text { font-size: 1.6rem; font-weight: 700; margin-bottom: 40px; line-height: 1.3; min-height: 80px; }
        .scale { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 550px; margin: 0 auto; }
        .dot { cursor: pointer; border-radius: 50%; border: 2px solid #334155; transition: 0.3s; }
        .dot:hover { border-color: var(--primary); transform: scale(1.15); box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }
        
        .progress-w { width: 100%; max-width: 800px; height: 6px; background: #1e293b; border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        .progress-f { height: 100%; background: linear-gradient(90deg, var(--primary), var(--purple)); width: 0%; transition: 0.4s; }

        .type-badge { display: inline-block; padding: 8px 20px; border-radius: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; font-size: 0.9rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="go('home')">WORLD<span>ID</span></div>
    <div style="font-size: 0.9rem; font-weight: 600; opacity: 0.6; cursor: pointer;" onclick="go('home')">ГЛАВНАЯ</div>
</nav>

<section id="home" class="active">
    <h1>Твоя личность — твоя сила.</h1>
    <p style="color: #94a3b8; font-size: 1.2rem; margin-bottom: 40px; text-align:center; max-width:600px;">Пройди универсальный тест и узнай, как твой характер влияет на карьеру, отношения и успех в жизни.</p>
    <div class="glass">
        <h2 style="margin-top:0">Готовы к открытию?</h2>
        <p>20 вопросов для точного анализа вашего психотипа.</p>
        <button class="btn" onclick="go('test')">НАЧАТЬ ТЕСТ</button>
    </div>
</section>
